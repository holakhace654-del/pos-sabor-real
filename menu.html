<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú · Sabor Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2">
<style>
  .menu-shell { display: flex; flex: 1; gap: 20px; padding: 22px; min-width: 0; }
  .menu-list { flex: 1.5; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .table-head-row { display: grid; grid-template-columns: 1.4fr 0.6fr 0.8fr 0.9fr 1fr; gap: 10px; padding: 10px 14px; font: 700 10.5px ui-monospace, monospace; color: var(--text-dim); text-transform: uppercase; }
  .menu-row { display: grid; grid-template-columns: 1.4fr 0.6fr 0.8fr 0.9fr 1fr; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--row-bg); cursor: pointer; }
  .menu-row.active { outline: 2px solid var(--accent); }
  .menu-row .ph-photo { width: 44px; height: 44px; border-radius: 10px; flex: none; }
  .toggle { width: 34px; height: 20px; border-radius: 12px; position: relative; cursor: pointer; }
  .toggle-knob { width: 16px; height: 16px; border-radius: 50%; background: #fff; position: absolute; top: 2px; transition: left .12s; }

  .edit-panel { width: 320px; flex: none; border-left: 1px solid var(--border); padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
  .edit-photo { height: 110px; border-radius: 14px; position: relative; cursor: pointer; }
  .mod-editor { display: flex; flex-direction: column; gap: 8px; }
  .mod-group-editor { border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .mod-opt-row { display: flex; gap: 6px; align-items: center; }
  .cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="menu-shell">
    <div class="menu-list">
      <div class="main-header">
        <div class="main-title">Menú</div>
        <button class="btn btn-primary" id="btn-nuevo">+ Nuevo producto</button>
      </div>
      <div class="cat-pills" id="cat-pills"></div>
      <div class="table-head-row"><div>Producto</div><div>Precio</div><div>Disponible</div><div>Domicilio</div><div>Modificadores</div></div>
      <div id="menu-rows" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="edit-panel" id="edit-panel"></div>
  </div>
</div>
<input type="file" id="file-foto" accept="image/*" style="display:none">
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/sounds.js?v=2"></script>
<script src="assets/js/layout.js?v=2"></script>
<script src="assets/js/menu.js?v=2"></script>
</body>
</html>
