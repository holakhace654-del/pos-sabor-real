<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario · Sabor Real</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .alert-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 14px; background: var(--danger-bg); }
  .insumo-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border); }
  .insumo-bar-track { width: 140px; height: 8px; border-radius: 6px; background: oklch(91% 0.01 60); }
  .insumo-bar-fill { height: 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div class="main-header">
      <div class="main-title">Inventario</div>
      <button class="btn btn-primary" id="btn-nuevo">+ Insumo</button>
    </div>
    <div id="alert-bar"></div>
    <div id="insumos" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="card form-card pop-in" style="width:420px">
    <div style="font:800 16px 'Manrope',sans-serif" id="modal-title">Insumo</div>
    <input class="input" id="f-nombre" placeholder="Nombre del insumo">
    <div class="form-row">
      <input class="input" id="f-unidad" placeholder="Unidad (kg, und, lt)">
      <input class="input" id="f-stock" placeholder="Stock actual" type="number">
    </div>
    <div class="form-row">
      <input class="input" id="f-minimo" placeholder="Stock mínimo (alerta)" type="number">
      <input class="input" id="f-meta" placeholder="Stock meta (100%)" type="number">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" id="btn-cancelar" style="flex:1">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar" style="flex:2">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="mov-backdrop">
  <div class="card form-card pop-in" style="width:360px">
    <div style="font:800 16px 'Manrope',sans-serif" id="mov-title">Movimiento de inventario</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" data-tipo="entrada" style="flex:1">Entrada</button>
      <button class="btn btn-ghost" data-tipo="salida" style="flex:1">Salida</button>
      <button class="btn btn-ghost" data-tipo="ajuste" style="flex:1">Ajuste</button>
    </div>
    <input class="input" id="mov-cantidad" placeholder="Cantidad" type="number">
    <input class="input" id="mov-motivo" placeholder="Motivo (opcional)">
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" id="mov-cancelar" style="flex:1">Cancelar</button>
      <button class="btn btn-primary" id="mov-guardar" style="flex:2">Registrar</button>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/sounds.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/inventario.js"></script>
</body>
</html>
