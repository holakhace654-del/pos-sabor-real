<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabor Real · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: 420px; max-width: calc(100vw - 32px); padding: 36px 32px;
    display: flex; flex-direction: column; gap: 22px; align-items: center;
  }
  .logo { width: 52px; height: 52px; border-radius: 16px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; color: #fff; font: 800 20px 'Manrope', sans-serif; }
  .title-block { text-align: center; }
  .title-block .name { font: 800 18px 'Manrope', sans-serif; }
  .title-block .sub { font: 500 12px 'Manrope', sans-serif; color: var(--text-dim); margin-top: 2px; }

  .user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .user-card {
    border: 2px solid var(--border); border-radius: 16px; padding: 14px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; background: #fff; transition: border-color .15s, transform .1s;
  }
  .user-card:hover { border-color: var(--accent); }
  .user-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .user-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font: 700 14px 'Manrope', sans-serif; color: var(--accent-soft-tx);
  }
  .user-name { font: 700 12px 'Manrope', sans-serif; text-align: center; }

  .pin-section { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .pin-label { font: 600 11px 'Manrope', sans-serif; color: var(--text-dim); }
  .pin-dots { display: flex; gap: 10px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); transition: background .12s, transform .12s; }
  .pin-dot.filled { background: var(--accent); transform: scale(1.1); }
  .pin-dots.shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  .keypad { display: grid; grid-template-columns: repeat(3, 56px); gap: 10px; }
  .key {
    height: 56px; border-radius: 14px; background: var(--ghost-bg); border: none;
    display: flex; align-items: center; justify-content: center; font: 700 18px 'Manrope', sans-serif;
    cursor: pointer; color: var(--text);
  }
  .key:active { transform: scale(0.93); background: var(--border); }
  .key.key-action { background: transparent; color: var(--text-dim); font-size: 13px; }

  .hint { min-height: 18px; font: 600 12px 'Manrope', sans-serif; color: var(--danger-text); }
</style>
</head>
<body>

<div class="card login-card pop-in">
  <div class="logo">SR</div>
  <div class="title-block">
    <div class="name">Sabor Real</div>
    <div class="sub" id="subtitle">Selecciona tu usuario</div>
  </div>

  <div class="user-grid" id="user-grid"></div>

  <div class="pin-section" id="pin-section" style="display:none">
    <div class="pin-label">Ingresa tu PIN</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="hint" id="hint"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/sounds.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
